    :root {
      --bg-base: #f4f7fc;
      --bg-card: #ffffff;
      --border-card: rgba(226, 232, 240, 0.9);
      --border-glow: #2563eb;
      --primary: #2563eb;
      --text-main: #0f172a;
      --text-muted: #475569;
      --bright-gradient: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #06b6d4 100%);
      --accent-pill: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      --paypal-gradient: linear-gradient(135deg, #003087 0%, #0079c1 100%);
      --shadow-card: 0 10px 30px -5px rgba(37, 99, 235, 0.08);
      --shadow-hover: 0 20px 40px -10px rgba(37, 99, 235, 0.2);
    }

    * { box-sizing: border-box; }

    body { 
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(37, 99, 235, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 90% 40%, rgba(6, 182, 212, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
        #f4f7fc;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    h1, h2, h3, .brand-title { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      letter-spacing: -0.03em;
    }

    section[id] {
      scroll-margin-top: 100px;
    }

    /* Navbar Header */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      padding: 1rem 0;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-img {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--text-main);
    }

    .brand-tagline {
      font-size: 0.675rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .links {
      display: flex;
      gap: 2rem;
    }

    .links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.925rem;
      transition: color 0.2s ease;
    }

    .links a:hover {
      color: var(--primary);
    }

    /* Vertical Stack Wrapper */
    .vertical-wrapper {
      display: flex;
      flex-direction: column;
      gap: 5rem;
      padding: 4rem 0 7rem 0;
    }

    /* Hero Section */
    .hero-vertical {
      text-align: center;
      max-width: 850px;
      margin: 0 auto;
    }

    .badge-glow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 22px;
      border-radius: 50px;
      background: rgba(37, 99, 235, 0.08);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.875rem;
      border: 1px solid rgba(37, 99, 235, 0.25);
      margin-bottom: 1.5rem;
    }

    .hero-title {
      font-size: clamp(2.75rem, 6vw, 4.25rem);
      font-weight: 800;
      line-height: 1.1;
      color: var(--text-main);
      margin-bottom: 1.5rem;
    }

    .gradient-text {
      background: var(--bright-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .lead {
      font-size: 1.15rem;
      color: var(--text-muted);
      line-height: 1.7;
      max-width: 680px;
      margin: 0 auto 2.5rem auto;
    }

      padding: 3rem;
      box-shadow: var(--shadow-card);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
